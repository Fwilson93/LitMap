[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litmap-slim"
version = "0.2.1"
description = "Slim local-first literature mapping with FastAPI, Jinja2, HTMX, and compact context tooling"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "scripts"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/*.css", "static/*.js"]

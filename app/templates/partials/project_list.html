<details class="rail-section" id="project-list" open>
  <summary>Projects</summary>
  <div class="rail-section-body">
    {% if projects %}
      <div class="stack compact">
        {% for item in projects %}
          <div class="project-row">
            <button
              class="project-pill {% if project and item.project_id == project.project_id %}project-pill--active{% endif %}"
              hx-get="/projects/{{ item.project_id }}/workspace"
              hx-target="#workspace"
              hx-swap="innerHTML"
              type="button"
            >
              <span>
                {{ item.title }}
                <small>{{ item.updated_at.strftime('%d %b %Y %H:%M') }}</small>
              </span>
            </button>
            <form hx-post="/projects/{{ item.project_id }}/delete" hx-target="#workspace" hx-swap="innerHTML">
              <button class="btn btn-danger btn-quiet" type="submit">Delete</button>
            </form>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="muted">Create a project to start your first map.</p>
    {% endif %}
  </div>
</details>

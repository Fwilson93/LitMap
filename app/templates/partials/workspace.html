<div>
<h3>Retrieval</h3>
{% for r in retrieval_items %}
<div>
<strong>{{ r.title }}</strong>
<p>PDF: {{ r.pdf_status }} | SI: {{ r.si_status }}</p>

{% if r.doi %}
<form hx-post="/projects/{{ project.project_id }}/retrieval/open">
<input type="hidden" name="doi" value="{{ r.doi }}">
<button>Open Paper</button>
</form>
{% endif %}

<form hx-post="/projects/{{ project.project_id }}/retrieval/mark">
<input type="hidden" name="cid" value="{{ r.candidate_id }}">
<button>Mark PDF Retrieved</button>
</form>

</div>
{% endfor %}
</div>
